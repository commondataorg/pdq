name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Leak gate
        run: |
          # the gate's own pattern lives in this file; everything else must match nothing
          if git grep -iE 'super-straw|SMO-|cortex|telesync|tpg-|observatory|gs://' -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'private references found in the tree' >&2
            exit 1
          fi
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Install pinned ffmpeg
        timeout-minutes: 10
        run: ./scripts/install-ffmpeg.sh
      - name: Build
        run: go build ./...
      - name: Test
        env:
          VPDQ_REQUIRE_FFMPEG: "1"
        run: go test ./...
      - name: Test with GOEXPERIMENT=simd
        env:
          VPDQ_REQUIRE_FFMPEG: "1"
          GOEXPERIMENT: simd
        run: go test ./...
      - name: Test with GOEXPERIMENT=simd at 128-bit lanes
        env:
          VPDQ_REQUIRE_FFMPEG: "1"
          GOEXPERIMENT: simd
          GODEBUG: simd=128
        run: go test .
